function loginForm(msg){
  $("#mb").innerHTML=`<h3 style="margin-top:0">Admin Login</h3>
  <form id="lf">
    <div class="mu">Username:</div>
    <input id="lu" placeholder="e.g. Admin@Mart, Admin02..." required>
    <div class="mu" style="margin-top:8px">Password:</div>
    <input id="lp" type="password" placeholder="Enter password" required>
    <div id="le" style="color:#ff8a80;min-height:22px;margin-top:6px">${e(msg||"")}</div>
    <p><button class="btn gold" type="submit">Log in</button> <button type="button" data-x="1">Cancel</button></p>
  </form>`;
  $("#modal").style.display="flex";
}

function form(c, id){
  const F = CF[c];
  const x = (D[c]||[]).find(y=>y.id==id)||{};
  $("#mb").innerHTML = `<h3 style="margin-top:0">${id?"Edit":"Add"} – ${F.t}</h3>
  ${F.f.map(([k,l,t])=>`<div class="mu" style="margin-top:6px">${l}:</div><input id="f_${k}" value="${e(x[k]||'')}" placeholder="${l}">`).join('')}
  <p><button class="btn gold" data-save="${c}:${id||""}">Save</button> <button data-x="1">Cancel</button></p>`;
  $("#modal").style.display = "flex";
}

document.addEventListener("click", ev => {
  const t = ev.target, d = t.dataset || {};
  if(d.v){ view = d.v; render(); menu(false); }
  if(d.login) loginForm();
  if(d.logout){ me = null; admin = false; render(); }
  if(d.x) $("#modal").style.display = "none";
  if(d.add) form(d.add, "");
  if(d.del){
    const [c, id] = d.del.split(":");
    if(confirm("Delete this entry?")){
      D[c] = (D[c]||[]).filter(x => x.id != id);
      saveState();
      render();
    }
  }
  if(d.save){
    const [c, id] = d.save.split(":");
    const F = CF[c];
    const item = { id: id || "id_" + Date.now() };
    F.f.forEach(([k]) => {
      const el = $("#f_" + k);
      if(el) item[k] = el.value.trim();
    });
    D[c] = (D[c]||[]).filter(x => x.id != item.id);
    D[c].unshift(item);
    saveState();
    $("#modal").style.display = "none";
    render();
  }
});

document.addEventListener("submit", ev => {
  if(ev.target.id != "lf") return;
  ev.preventDefault();
  const u = $("#lu").value.trim().toLowerCase();
  const p = $("#lp").value;
  const found = AL.find(a => a.username.toLowerCase() === u && a.password === p);
  if(found){
    me = found;
    admin = !!found.owner;
    $("#modal").style.display = "none";
    render();
  } else {
    $("#le").textContent = "Invalid username or password.";
  }
});

render();
</script>
