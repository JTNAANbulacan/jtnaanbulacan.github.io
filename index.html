<style>

/* Dedicated Dual-Layer Church Background */

  z-index:-2;
  pointer-events:none;
  background-size:cover !important;
  background-position:center center !important;
  background-repeat:no-repeat !important;
  filter:blur(9px);
  -webkit-filter:blur(9px);
  transform:scale(1.05);
  transition:background-image 0.4s ease;
}
#site-bg-overlay{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:radial-gradient(1000px 400px at 100% 0,rgba(42,42,168,0.45),transparent 60%),linear-gradient(rgba(11,10,58,0.72),rgba(11,10,58,0.86));
}

/* Header & Circular Logo */
header{display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:6;background:#0b0a3af2;border-bottom:1px solid var(--bd);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#header-logo-container{
  flex:0 0 44px !important;
  width:44px !important;
  height:44px !important;
  min-width:44px !important;
  min-height:44px !important;
  max-width:44px !important;
  max-height:44px !important;
  border-radius:50% !important;
  background:#fff !important;
  border:2px solid var(--pr) !important;
  padding:0 !important;
  margin:0 !important;
  overflow:hidden !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  cursor:pointer !important;
  box-shadow:0 2px 10px rgba(0,0,0,.4) !important;
  transition:transform .2s !important;
  box-sizing:border-box !important;
}
#header-logo-container:hover{transform:scale(1.06)}
#church-logo-render{
  width:100% !important;
  height:100% !important;

  justify-content:center !important;

.feed{display:grid;gap:clamp(.8rem,1.5vw,1.4rem);max-width:44rem;margin-inline:auto}

.cm{padding:8px 12px 12px}

.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.qr{background:#ffffff0f;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.qr img{width:100%;max-width:18rem;height:auto;max-height:22rem;object-fit:contain;background:#fff;padding:8px;border-radius:10px;align-self:center}

.shg{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:8px;margin:12px 0}

.appb{background:linear-gradient(135deg,#2a2aa8cc,#15145acc);border:1px solid var(--pr);border-radius:14px;padding:clamp(.9rem,2.5vw,1.6rem)}

.appl{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;list-style:none;padding:0;margin:.8rem 0}.appl li::before{content:"✓ ";color:var(--pr);font-weight:700}
.appbt{display:flex;flex-wrap:wrap;gap:.6rem}.appd{display:flex;align-items:center;gap:.6rem;background:#000;border:1px solid #fff6;border-radius:10px;padding:.5rem 1.1rem;text-align:left;min-width:11rem}

#hl{flex:none;display:flex;align-items:center;gap:.4rem}.hlu{font-size:.85rem;margin-right:.2rem;white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;padding:0;border-radius:10px;background:#ffffff14;border:1px solid var(--bd);color:var(--tx);transition:background .2s}

let SUPABASE_URL = localStorage.getItem("jt_sp_url") || "";
let SUPABASE_ANON = localStorage.getItem("jt_sp_key") || "";

let supabaseClient = null;
function initSupabaseClient(){
  if(SUPABASE_URL && SUPABASE_ANON && window.supabase){
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
      console.log("☁ Supabase Cloud Connected!");
      setupRealtimeSync();
    } catch(e) {
      console.warn("Supabase init error:", e);
    }
  }
}

// Cloud Sync Engine
async function syncRecordToCloud(collection, id, dataObj){
  if(!supabaseClient) return;
  try {
    await supabaseClient.from('church_records').upsert({
      collection: collection,
      id: String(id),
      data: dataObj,
      updated_at: new Date().toISOString()
    });
  } catch(err) {
    console.warn("Cloud sync error:", err);
  }
}

async function deleteRecordFromCloud(collection, id){
  if(!supabaseClient) return;
  try {
    await supabaseClient.from('church_records').delete().match({
      collection: collection,
      id: String(id)
    });
  } catch(err) {
    console.warn("Cloud delete error:", err);
  }
}

// Fetch All Records from Cloud on Load
async function fetchAllFromCloud(){
  if(!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient.from('church_records').select('*');
    if(error || !data || data.length === 0){
      // First time connecting: seed cloud database with initial church data
      seedCloudDatabase();
      return;
    }

    // Reconstruct D from cloud records
    const cloudD = {
      members: [], ministries: [], funds: [], fbposts: [], devotion: [],
      attendance: [], social: [], events: [], prayers: [], testimony: [],
      donate: [], gallery: [], comments: [], settings: []
    };

    data.forEach(row => {
      if(row.collection && cloudD[row.collection] !== undefined){
        cloudD[row.collection].push({ id: row.id, ...row.data });
      }
    });

    // Populate D with cloud data
    Object.keys(cloudD).forEach(k => {
      if(cloudD[k].length > 0){
        D[k] = cloudD[k];
      }
    });

    applyBackground();
    renderLogo();
    render();
  } catch(e) {
    console.warn("Fetch cloud records error:", e);
  }
}

// Seed the cloud database on initial setup
async function seedCloudDatabase(){
  if(!supabaseClient) return;
  const rows = [];
  Object.keys(churchData).forEach(coll => {
    (churchData[coll] || []).forEach(item => {
      rows.push({
        collection: coll,
        id: String(item.id),
        data: item,
        updated_at: new Date().toISOString()
      });
    });
  });

  if(rows.length > 0){
    try {
      await supabaseClient.from('church_records').upsert(rows);
      console.log("☁ Church database successfully seeded in Supabase!");
    } catch(err) {
      console.warn("Seed error:", err);
    }
  }
}

async function upload(f, maxDim = 1200, quality = 0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement("canvas");
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        cv.width = Math.round(w); cv.height = Math.round(h);
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(f);
  });
}

  alert("Text updated!");

async function saveFormData(c, id){
  const F = CF[c];
  const item = { id: id || "id_" + Date.now().toString(36) };
  F.f.forEach(([k]) => {
    const el = $("#f_" + k);
    if(el) item[k] = el.value.trim();
  });
  
  if(c === 'gallery'){
    const phInput = $("#f_photos");
    if(phInput && phInput.files.length > 0){
      const upList = [];
      const files = Array.from(phInput.files).slice(0, 6);
      for(const f of files){
        upList.push(await upload(f, 1000, 0.75));
      }
      item.photos = upList;
    } else if(id) {
      const old = (D[c]||[]).find(y => y.id === id) || {};
      item.photos = old.photos || [];
    }
  }

  const ph = $("#f_photo");
  if(ph && ph.files[0]){
    item.photo = await upload(ph.files[0], 900, 0.78);
  } else if(id) {
    const old = (D[c]||[]).find(y => y.id === id) || {};
    if(old.photo) item.photo = old.photo;
  }
  
  D[c] = (D[c]||[]).filter(x => x.id !== item.id);
  D[c].unshift(item);
  
  // Real-time Cloud Sync
  await syncRecordToCloud(c, item.id, item);
  saveState();
  closeModal();
  render();
  alert("Saved and synced live across all devices!");
}

// Fullscreen Confetti Engine for Correct Quiz Answer
function triggerQuizConfetti(){
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:99999;";
  document.body.appendChild(c);
  const x = c.getContext("2d");
  const dp = devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  c.width = W * dp; c.height = H * dp;
  x.scale(dp, dp);

  const C = ["#f2a93b", "#ffd86b", "#2ecc71", "#3b8bff", "#ff5e8a", "#ffffff", "#a66bff"];
  const P = [];
  for (let i = 0; i < 180; i++) {
    const fromL = i % 2;
    const a = (fromL ? -60 : -120) * Math.PI / 180 + (Math.random() - .5) * .9;
    const v = 9 + Math.random() * 9;
    P.push({
      x: fromL ? 0 : W,
      y: H * .75,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      r: Math.random() * 6,
      vr: (Math.random() - .5) * .35,
      c: C[i % C.length]
    });
  }

  const t0 = performance.now();
  (function f(t) {
    const el = t - t0;
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += .28; p.vx *= .99; p.vy *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save();
      x.globalAlpha = Math.max(0, 1 - el / 3200);
      x.translate(p.x, p.y);
      x.rotate(p.r);
      x.fillStyle = p.c;
      x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
      x.restore();
    }
    el < 3300 ? requestAnimationFrame(f) : c.remove();
  })(t0);
}

        <b>${e(x.title||x.name||'')}</b>
        <div class="mu">${e(x.date||'')} · ${e(x.place||'')}</div>
        <div style="margin:4px 0">${e(x.desc||'')}</div>
        ${can(c)?`
          <div style="margin-top:8px">
            <button class="btn sm" onclick="openFormModal('${c}', '${x.id}')">Edit</button>
            <button class="btn red sm" onclick="deleteRecord('${c}', '${x.id}')">Delete</button>
          </div>
        `:''}
      </div>
    `).join('')||'<p class="mu">Nothing yet.</p>'}
  </div>`;
}

function adminsv(){
  if(!admin) return `<p class="mu">Access restricted to Super Admin.</p>`;
  return `<h2>ADMINS MANAGEMENT</h2>
  <div class="grid">${AL.map(a=>`
    <div class="card">
      <b style="font-size:1.1rem;color:var(--pr)">${e(a.name)}</b>
      <div class="mu">Username: <b>${e(a.username)}</b></div>
      <div style="font-size:.85rem">Role: <b>${a.owner ? 'Super Admin (All Access)' : a.perms.map(p=>PL[p]||p).join(', ')}</b></div>
    </div>
  `).join('')}</div>`;
}

async function deleteRecord(c, id){
  if(confirm("Are you sure you want to delete this record?")){
    D[c] = (D[c]||[]).filter(x => x.id !== id);
    await deleteRecordFromCloud(c, id);
    saveState();
    render();
  }
}

// Session System
async function handleLogout(){
  me = null;
  admin = false;
  localStorage.setItem("jt_active_session", "null");
  render();
}

function loginForm(msg){
  $("#mb").innerHTML = `
    <h3 style="margin-top:0">Admin Login</h3>
    <form id="lf" onsubmit="handleLoginSubmit(event)">
      <div class="mu">Username:</div>
      <input id="lu" placeholder="e.g. Admin@Mart, Admin02..." autocomplete="username" required>
      <div class="mu" style="margin-top:8px">Password:</div>
      <input id="lp" type="password" placeholder="Enter password" autocomplete="current-password" required>
      <div id="le" style="color:#ff8a80;min-height:22px;margin-top:6px">${e(msg||"")}</div>
      <p>
        <button class="btn gold" type="submit">Log in</button>
        <button type="button" onclick="closeModal()">Cancel</button>
      </p>
    </form>`;
  $("#modal").style.display = "flex";
  setTimeout(() => { const el = $("#lu"); if(el) el.focus(); }, 60);
}

async function handleLoginSubmit(ev){
  ev.preventDefault();
  const u = $("#lu").value.trim().toLowerCase();
  const p = $("#lp").value;
  const found = AL.find(a => a.username.toLowerCase() === u && a.password === p);
  if(found){
    me = found;
    admin = !!found.owner;
    localStorage.setItem("jt_active_session", JSON.stringify(found));
    closeModal();
    render();
  } else {
    $("#le").textContent = "Invalid username or password.";
  }
}

document.addEventListener("click", ev => {
  const t = ev.target, d = t.dataset || {};
  if(d.v){ view = d.v; render(); menu(false); }
});

// Boot & Live Sync Initialization
async function initApp(){
  initSupabaseClient();
  await fetchAllFromCloud();
  applyBackground();
  renderLogo();
  render();
}

initApp();
</script>
