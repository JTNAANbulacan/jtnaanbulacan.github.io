<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0820"><title>JTNAAN Presenter</title>
<style>
:root{color-scheme:dark;--bg:#0b0820;--panel:#17132f;--panel2:#211b43;--line:#393064;--purple:#8b5cf6;--gold:#e0a53b;--text:#f5f3ff;--muted:#b9b1d9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 420px at 100% 0,#4c1d9555,transparent 60%),var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel2);color:var(--text);font-weight:600}button:hover{border-color:var(--purple)}button:disabled{opacity:.4;cursor:not-allowed}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:#0d0922ed;position:sticky;top:0;z-index:5}.brand{font-size:17px;font-weight:800;letter-spacing:.2px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:245px minmax(280px,1fr) minmax(320px,1.2fr);gap:12px;padding:12px;min-height:calc(100vh - 62px)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}.panelhead{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;display:flex;align-items:center;justify-content:space-between}.scroll{padding:10px;overflow:auto;max-height:calc(100vh - 135px)}.item{display:block;width:100%;text-align:left;margin:0 0 7px;background:#1e193b;border-color:transparent}.item.active{border-color:var(--gold);background:#33264b}.slidegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;padding:12px;align-content:start;overflow:auto;max-height:calc(100vh - 135px)}.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#211744,#0d0a20);border:1px solid var(--line);border-radius:9px;padding:9px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;white-space:pre-wrap;font-size:clamp(10px,1vw,14px);cursor:pointer}.thumb.active{outline:2px solid var(--gold)}.thumb small{position:absolute}.right{display:grid;grid-template-rows:1fr 1fr auto;gap:10px;padding:10px}.preview{background:linear-gradient(135deg,#20183e,#0b0820);border:1px solid var(--line);border-radius:12px;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;white-space:pre-wrap;font-size:clamp(18px,2vw,30px);font-weight:750;line-height:1.25;overflow:hidden}.preview label{font-size:10px;letter-spacing:1.5px;color:var(--gold);margin-bottom:12px}.controls{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.primary{background:var(--gold);color:#211700;border-color:var(--gold)}.status{font-size:12px;color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:200px 1fr}.right{grid-column:1/-1;grid-template-columns:1fr 1fr;grid-template-rows:minmax(180px,1fr) auto}.controls{grid-column:1/-1}.scroll,.slidegrid{max-height:42vh}}@media(max-width:580px){.top{height:auto;gap:8px;flex-wrap:wrap}.layout{grid-template-columns:1fr;padding:8px}.panelhead{padding:10px}.scroll{max-height:220px}.slidegrid{max-height:320px;grid-template-columns:repeat(2,minmax(0,1fr))}.right{grid-column:auto;grid-template-columns:1fr;grid-template-rows:1fr 1fr auto}.preview{min-height:155px}.controls{grid-column:auto}}
</style></head><body>
<header class="top"><div class="brand">♫ JTNAAN <span style="color:#c4b5fd">PRESENTER</span></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span id="who" class="status">Checking account…</span><button id="back">⇄ Switch App</button><button id="signout">Sign out</button></div></header>
<main class="layout">
<section class="panel"><div class="panelhead">SERVICE ORDER <span class="status" id="songcount">—</span></div><div class="scroll" id="songs"><div class="empty">Loading song library…</div></div></section>
<section class="panel"><div class="panelhead">SLIDE OVERVIEW <span class="status" id="slidecount">0 slides</span></div><div class="slidegrid" id="slides"><div class="empty">Choose a song to view its slides.</div></div></section>
<section class="panel right"><div><div class="panelhead">● LIVE</div><div class="preview" id="livePreview">No slide selected</div></div><div><div class="panelhead">NEXT</div><div class="preview" id="nextPreview">—</div></div><div class="controls"><button id="previous">← Previous</button><button id="blank">Blank</button><button class="primary" id="next">Next →</button><span class="status" id="counter">0 / 0</span></div></section>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.49.1';
const db=createClient('https://uykbhdbtyghdnfhgpctv.supabase.co','sb_publishable_caMA2wvJb-jUh36Loqz8XQ_2h-oUYFk');
const $=id=>document.getElementById(id);let user=null,songs=[],playlists=[],links=[],sessions=[],live=null,selected=null,slides=[],index=0,channel=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function makeSlides(song){const raw=String(song?.lyrics_chords||'').replace(/\r/g,'').trim();if(!raw)return [song?.title||''];const blocks=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);return blocks.length?blocks:[raw]}
function draw(){ $('songcount').textContent=songs.length+' songs';$('songs').innerHTML=songs.map(s=>'<button class="item '+(selected?.id===s.id?'active':'')+'" data-song="'+esc(s.id)+'">'+esc(s.title)+'</button>').join('')||'<div class="empty">No songs found.</div>';document.querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>selectSong(b.dataset.song));$('slidecount').textContent=slides.length+' slides';$('slides').innerHTML=slides.map((x,i)=>'<div class="thumb '+(i===index?'active':'')+'" data-slide="'+i+'">'+esc(x)+'</div>').join('')||'<div class="empty">Choose a song to view its slides.</div>';document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.slide);renderPreview()});renderPreview()}
function renderPreview(){const a=slides[index]||'No slide selected',b=slides[index+1]||'End of presentation';$('livePreview').textContent=a;$('nextPreview').textContent=b;$('counter').textContent=slides.length?(index+1)+' / '+slides.length:'0 / 0';document.querySelectorAll('[data-slide]').forEach(x=>x.classList.toggle('active',Number(x.dataset.slide)===index))}
async function selectSong(id){selected=songs.find(x=>x.id===id)||null;slides=makeSlides(selected);index=0;draw();if(live&&live.controller_user_id===user.id){const songPosition=links.filter(x=>x.playlist_id===live.playlist_id).findIndex(x=>x.song_id===selected.id);const {error}=await db.from('worship_live_sessions').update({song_id:selected.id,song_index:Math.max(0,songPosition),scroll_position:0,presentation_state:{...(live.presentation_state||{}),section_index:0,slide_index:0,blank:false,custom_slide:null},updated_by:user.id,updated_at:new Date().toISOString()}).eq('id',live.id);if(error)$('who').textContent='Loaded locally · '+error.message;else $('who').textContent='Connected · live session updated'}}
async function publish(){if(!live||live.controller_user_id!==user.id){$('who').textContent='Select a song locally. A live session controlled by your account is needed to broadcast.';return}const state={...(live.presentation_state||{}),section_index:index,slide_index:index,blank:false,custom_slide:null};const {error}=await db.from('worship_live_sessions').update({song_id:selected?.id||live.song_id,scroll_position:index*1000,presentation_state:state,updated_by:user.id,updated_at:new Date().toISOString()}).eq('id',live.id);if(error)$('who').textContent='Could not broadcast: '+error.message;else{live.presentation_state=state;live.song_index=index;$('who').textContent='Live · '+(index+1)+' / '+slides.length}}
$('next').onclick=async()=>{if(index<slides.length-1){index++;renderPreview();await publish()}};$('previous').onclick=async()=>{if(index>0){index--;renderPreview();await publish()}};$('blank').onclick=async()=>{if(!live||live.controller_user_id!==user.id){$('who').textContent='No live session controlled by your account.';return}const state={...(live.presentation_state||{}),blank:true};const {error}=await db.from('worship_live_sessions').update({presentation_state:state,updated_by:user.id,updated_at:new Date().toISOString()}).eq('id',live.id);if(error)$('who').textContent=error.message;else $('livePreview').textContent='BLANK'}}
$('back').onclick=()=>location.href='/worship-team-hub/';$('signout').onclick=async()=>{await db.auth.signOut();location.href='/worship-team-hub/'};
async function init(){const {data:{session},error}=await db.auth.getSession();if(error||!session?.user){location.replace('/worship-team-hub/');return}user=session.user;$('who').textContent='Signed in · '+(user.user_metadata?.nickname||user.user_metadata?.username||'Team member');const [a,b,c]=await Promise.all([db.from('worship_songs').select('*').order('title'),db.from('worship_playlists').select('*').order('created_at',{ascending:false}),db.from('worship_playlist_songs').select('*').order('position')]);if(a.error||b.error||c.error){$('songs').innerHTML='<div class="empty">Could not load the shared song library: '+esc((a.error||b.error||c.error).message)+'</div>';return}songs=a.data.filter(x=>x.title!=='__app_logo__');playlists=b.data;links=c.data;const {data:ls}=await db.from('worship_live_sessions').select('*').eq('is_live',true).order('created_at',{ascending:false}).limit(10);sessions=ls||[];live=sessions.find(x=>x.controller_user_id===user.id)||sessions[0]||null;draw();if(channel)db.removeChannel(channel);channel=db.channel('jtnaan-presenter-sync').on('postgres_changes',{event:'UPDATE',schema:'public',table:'worship_live_sessions'},async()=>{const {data}=await db.from('worship_live_sessions').select('*').eq('is_live',true).order('created_at',{ascending:false}).limit(10);sessions=data||[];live=sessions.find(x=>x.controller_user_id===user.id)||sessions[0]||null}).subscribe()}
init();
</script></body></html>
